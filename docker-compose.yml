name: Influx3_Telegraf
services:

  grafana:
    image: grafana/grafana:main-ubuntu
    container_name: grafana_main
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
        # This settigns will override th conf/grafana.ini
      - TZ=America/Mexico_City
      - GF_DEFAULT_INSTANCE_NAME=${INSTANCE_NAME}
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - INFLUX_API_TOKEN=${GF_API_TOKEN}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    depends_on:
      - influxdb3-core
    networks:
      - iot-network

  influxdb3-init:
    image: influxdb:3.6.0-core
    container_name: influxdb3-init
    user: root
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/influxdb3/data /var/lib/influxdb3/plugins && \
        chown -R influxdb3:influxdb3 /var/lib/influxdb3
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    restart: "no"

  influxdb3-core:
    container_name: influxdb3-core
    image: influxdb:3.6.0-core
    ports:
      - 8181:8181
    environment:
      - INFLUXDB3_ADMIN_TOKEN_FILE=run/secrets/influxdb_admin_token
      - INFLUXDB3_DATABASE_NAME=${INFLUX_DB_NAME}
      - TZ=America/Mexico_City
    depends_on:
      influxdb3-init:
        condition: service_completed_successfully
    user: influxdb3
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
    volumes:
      - influxdb3-data:/var/lib/influxdb3/data
      - influxdb3-plugins:/var/lib/influxdb3/plugins
    secrets:
      - influxdb_admin_token
    networks:
      - iot-network

  explorer:
    image: influxdata/influxdb3-ui:1.4.0
    container_name: influxdb3-explorer
    command: ["--mode=admin"]
    ports:
      - "8888:80"
    volumes:
      - ./influxdb/config:/app-root/config:ro
    restart: unless-stopped
    networks:
      - iot-network

  telegraf:
    image: telegraf:1.36.3
    container_name: telegraf
    environment:
      MQTT_BROKER: ${MQTT_BROKER_URL}
      INFLUX_SERVICE: influxdb3-core
      INFLUX_PORT: 8181
      DATABASE_NAME: ${INFLUX_DB_NAME}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      INFLUX_TOKEN: ${INFLUXDBTOKEN_TELEGRAF_API}
    # for dev avoid secrets use direct env variables
    # secrets:
    #   - mqtt_user
    #   - mqtt_pass
    #   - influxdbtoken_telegraf
    user: "1000"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb3-core
    restart: unless-stopped
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge

volumes:
  influxdb3-data:
  influxdb3-plugins:
  grafana-data:

secrets:
  influxdb_admin_token:
    file: ./secrets/influxdb_admin_token.env
  # mqtt_user:
  #   environment: mqtt_user
  # mqtt_pass:
  #   environment: mqtt_pass
  # influxdbtoken_telegraf:
  #   environment: influxdbtoken_telegraf
